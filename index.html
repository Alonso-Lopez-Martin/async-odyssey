<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Buscador de Exoplanetas</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <h1>🪐 Explorador de Exoplanetas</h1>
  
  <div class="search-panel">
    <input type="text" id="search-input" placeholder="Ej: Kepler-22 b, TRAPPIST-1..." autocomplete="off">
    <button id="search-btn">Buscar Planeta</button>
    <a href="https://science.nasa.gov/exoplanet-catalog/" target="_blank" class="btn-secondary">Catálogo de Exoplanetas</a>
  </div>

  <p id="message-box" class="estado-mensaje"></p>
  
  <!-- CORRECCIÓN: Contenedor para mostrar la lista interactiva de coincidencias -->
  <div id="matches-container" class="matches-container"></div>

  <div class="viewer-container">
    <div id="planet-display">
      <p style="color: #666;">Inicia una búsqueda para visualizar telemetría.</p>
    </div>
    <div id="planet-info" class="data-corner"></div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
