<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Buscador de Exoplanetas</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <h1>🪐 Explorador de Exoplanetas</h1>
  
  <!-- El buscador -->
  <div class="search-panel">
    <input type="text" id="search-input" placeholder="Ej: Kepler-22 b, TRAPPIST-1..." />
    <button id="search-btn">Buscar Planeta</button>
  </div>

  <p id="message-box" class="estado-mensaje"></p>

  <!-- El visor principal -->
  <div class="viewer-container">
    <div id="planet-display">
      <!-- Aquí inyectaremos el planeta rotando -->
    </div>
    
    <!-- Los datos en la esquina -->
    <div id="planet-info" class="data-corner">
      <p>Inicia una búsqueda para visualizar telemetría.</p>
    </div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
